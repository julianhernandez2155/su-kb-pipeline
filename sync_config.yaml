# v1 — single-space scope (Phase 1 of pipeline-spec.md v0.4)
# Only ITSAI will actually be pulled in v1 (UI gates the rest).
# Full inclusion config matures in v1.5+ as more spaces enter scope.

space_categories:
  ITSAI: knowledge-bases
  CDIAPPS: knowledge-bases
  ITHELP: its
  itslemp: its
default_space_category: uncategorized

# Inclusion gates — three-knob logic:
# final_include = (page_count >= min_pages_threshold OR key in include_keys)
#                  AND key not in excluded_keys
min_pages_threshold: 5
include_keys: []
excluded_keys:
  - T002
  - INFRASB
  - ONEITSAND

# v1 enables only ITSAI; other spaces are visually disabled in UI.
enabled_keys:
  - ITSAI

# Phase 1.1 access classification (ADR-0007): spaces operator-declared as
# broadly accessible to the SU community. Overrides the positive-ID heuristic
# (role:ANONYMOUS read/space marker) — use sparingly.
# Leave empty if every listed space has the standard role:ANONYMOUS marker;
# positive ID handles the common case. List a space here only when the
# marker is missing for legitimate reasons (e.g., a space that's restricted
# to a known SU-wide group via a custom group ID).
broadly_accessible_spaces: []

output_dir: ./output
api_base: https://su-jsm.atlassian.net/wiki/api/v2
rate_limit_per_sec: 5
inventory_path: ../../research/kb-ingestion-project/data/confluence-inventory-2026-05-13.json
