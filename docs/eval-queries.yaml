# 15-query eval set for v1.5 chat-interface validation
# See: next-phase-plan.md Step 1 for methodology, Step 3 for baseline scoring,
# Step 6 for wiki-augmented scoring.
#
# Each query represents realistic SU student / faculty / staff intent.
# `expected_pages` is the human-curated set of raw page_ids the answer SHOULD draw from.
# `expected_to_benefit_from_wiki: true` marks queries whose ⚠️/❌ baseline score should improve
# with the seeded wiki hubs in place.

queries:
  - id: q01
    type: factual
    question: "Can I upload FERPA-protected student data to Claude at Syracuse?"
    expected_topics: [data classification, Claude, university data]
    expected_pages: ["488210484", "488144948"]

  - id: q02
    type: factual
    question: "How long does Anthropic retain my Claude chats?"
    expected_topics: [data retention, Claude]
    expected_pages: ["488210484"]

